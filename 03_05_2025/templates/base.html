<!DOCTYPE html>

<html>
    <head>
        <title>
            {% block title %}
                main
            {% endblock  %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <style>
            body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            header .bas {
            background: #343a40;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 0 0 10px 10px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
            }
            main > div {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 2rem;
            margin-bottom: 2rem;
    
            
            }
            footer > div {
            text-align: center;
            color: #6c757d;
            padding: 1rem 0;
            font-size: 0.95rem;
            }
            a{
                text-decoration: none;
                color: #d0cdcd;
            }
            a :hover{
                color: #4a8bab;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="bas">
                <h1>
                    <p>Home Work</p> 
                    <a href="{% url 'student-list' %}">Student</a>
                    <a href="{% url 'teacher-list' %}" style="padding-left: 20px; ">Teacher</a>
                    <a href="{% url 'feedback-list' %}"style="padding-left: 20px;">Feedback</a>
                </h1>
            </div>
        </header>
        <main>
            <div>
                {% block body %}
                    <div style="margin-left: 44%;">
                        <a href="{% url 'user-login' %}" style="margin-left: 30px; color: #343a40; text-decoration: none;">Log in</a>
                        <a href="{% url 'user-singup' %}" style="margin-left: 30px; color: #343a40; text-decoration: none;">sign up</a>
                    </div>
                {% endblock  %}
            </div>
        </main>
        <footer>
            <div>
                 @ Nasrettin tarafindan yapildi
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    </body>
</html>
